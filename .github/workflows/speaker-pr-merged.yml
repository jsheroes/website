name: Speaker PR merged

# Tells the speaker portal that a speaker PR (a new draft speaker or an update) was
# merged, so /admin shows "PR merged" instead of "PR open". Run it by hand with a PR
# number to report a merge the portal missed.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of a merged speaker PR
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       (startsWith(github.event.pull_request.head.ref, 'speaker/') ||
        startsWith(github.event.pull_request.head.ref, 'speaker-update/')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTAL_URL: ${{ vars.SPEAKER_PORTAL_URL }}
      PORTAL_SECRET: ${{ secrets.SPEAKER_PORTAL_WORKFLOW_SECRET }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
    steps:
      - name: Report the merge to the portal
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then echo "::error::Invalid PR number"; exit 1; fi
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url,body,mergedAt,headRefName)
          if [ "$(jq -r '.mergedAt // empty' <<<"$pr")" = "" ]; then
            echo "::error::PR #$PR_NUMBER isn't merged"; exit 1
          fi
          case "$(jq -r .headRefName <<<"$pr")" in
            speaker/*|speaker-update/*) ;;
            *) echo "::error::PR #$PR_NUMBER isn't a speaker PR"; exit 1 ;;
          esac
          # The onboarding workflow writes the submission id into the PR body.
          SUBMISSION_ID=$(jq -r .body <<<"$pr" | grep -oE 'submission `[a-f0-9]{16,64}`' | head -1 | tr -d '`' | cut -d' ' -f2)
          if [ -z "$SUBMISSION_ID" ]; then
            echo "::notice::No speaker portal submission in PR #$PR_NUMBER; nothing to report."; exit 0
          fi
          jq -n --arg prUrl "$(jq -r .url <<<"$pr")" '{status: "merged", prUrl: $prUrl}' |
          curl -fsS -X POST -H "Authorization: Bearer $PORTAL_SECRET" -H "Content-Type: application/json" \
            --data @- "$PORTAL_URL/api/submissions/$SUBMISSION_ID/status"
          echo "Reported PR #$PR_NUMBER as merged for submission $SUBMISSION_ID"
